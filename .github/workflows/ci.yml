name: Native rebuild checks

on:
  push:
    branches: [main, refactor/beta.4-native-rebuild, codex/nova-clip-1.0.0-beta.7-remediation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400
      - name: Dependency policy
        shell: pwsh
        run: ./scripts/check-dependencies.ps1
      - name: NuGet vulnerability audit
        run: |
          dotnet list tests/NovaClip.Core.Tests/NovaClip.Core.Tests.csproj package --vulnerable --include-transitive
          dotnet list tests/NovaClip.Infrastructure.Tests/NovaClip.Infrastructure.Tests.csproj package --vulnerable --include-transitive
          dotnet list tests/NovaClip.Bilibili.Tests/NovaClip.Bilibili.Tests.csproj package --vulnerable --include-transitive
          dotnet list tests/NovaClip.Updater.Tests/NovaClip.Updater.Tests.csproj package --vulnerable --include-transitive
      - name: Restore
        run: |
          dotnet restore tests/NovaClip.Core.Tests/NovaClip.Core.Tests.csproj
          dotnet restore tests/NovaClip.Infrastructure.Tests/NovaClip.Infrastructure.Tests.csproj
          dotnet restore tests/NovaClip.Bilibili.Tests/NovaClip.Bilibili.Tests.csproj
          dotnet restore tests/NovaClip.Updater.Tests/NovaClip.Updater.Tests.csproj
      - name: Build
        run: |
          dotnet build src/NovaClip.Contracts/NovaClip.Contracts.csproj -c Release
          dotnet build src/NovaClip.Core/NovaClip.Core.csproj -c Release
          dotnet build src/NovaClip.Bilibili/NovaClip.Bilibili.csproj -c Release
          dotnet build src/NovaClip.Infrastructure/NovaClip.Infrastructure.csproj -c Release
          dotnet build src/NovaClip.Updater/NovaClip.Updater.csproj -c Release
      - name: Test
        run: |
          dotnet test tests/NovaClip.Core.Tests/NovaClip.Core.Tests.csproj -c Release
          dotnet test tests/NovaClip.Infrastructure.Tests/NovaClip.Infrastructure.Tests.csproj -c Release
          dotnet test tests/NovaClip.Bilibili.Tests/NovaClip.Bilibili.Tests.csproj -c Release
          dotnet test tests/NovaClip.Updater.Tests/NovaClip.Updater.Tests.csproj -c Release
  static-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400
      - name: Dependency policy
        shell: pwsh
        run: ./scripts/check-dependencies.ps1
      - name: Localization and architecture gates
        shell: pwsh
        run: |
          ./scripts/check-localization.ps1
          ./scripts/check-architecture.ps1
