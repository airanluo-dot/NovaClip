name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore tests/BiliNative.Core.Tests/BiliNative.Core.Tests.csproj
          dotnet restore tests/BiliNative.Infrastructure.Tests/BiliNative.Infrastructure.Tests.csproj
          dotnet restore tests/BiliNative.WebBridge.Tests/BiliNative.WebBridge.Tests.csproj
          dotnet restore src/BiliNative.Updater/BiliNative.Updater.csproj
      - name: Build cross-platform projects
        run: |
          dotnet build src/BiliNative.Core/BiliNative.Core.csproj -c Release --no-restore
          dotnet build src/BiliNative.Infrastructure/BiliNative.Infrastructure.csproj -c Release --no-restore
          dotnet build src/BiliNative.WebBridge/BiliNative.WebBridge.csproj -c Release --no-restore
          dotnet build src/BiliNative.Updater/BiliNative.Updater.csproj -c Release --no-restore
      - name: Test
        run: |
          dotnet test tests/BiliNative.Core.Tests/BiliNative.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-tests.trx"
          dotnet test tests/BiliNative.Infrastructure.Tests/BiliNative.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=infrastructure-tests.trx"
          dotnet test tests/BiliNative.WebBridge.Tests/BiliNative.WebBridge.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=webbridge-tests.trx"
