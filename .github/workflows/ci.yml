name: Native rebuild checks

on:
  push:
    branches: [main, refactor/beta.4-native-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore tests/NovaClip.Core.Tests/NovaClip.Core.Tests.csproj
          dotnet restore tests/NovaClip.Infrastructure.Tests/NovaClip.Infrastructure.Tests.csproj
          dotnet restore tests/NovaClip.Bilibili.Tests/NovaClip.Bilibili.Tests.csproj
      - name: Build
        run: |
          dotnet build src/NovaClip.Contracts/NovaClip.Contracts.csproj -c Release
          dotnet build src/NovaClip.Core/NovaClip.Core.csproj -c Release
          dotnet build src/NovaClip.Bilibili/NovaClip.Bilibili.csproj -c Release
          dotnet build src/NovaClip.Infrastructure/NovaClip.Infrastructure.csproj -c Release
      - name: Test
        run: |
          dotnet test tests/NovaClip.Core.Tests/NovaClip.Core.Tests.csproj -c Release
          dotnet test tests/NovaClip.Infrastructure.Tests/NovaClip.Infrastructure.Tests.csproj -c Release
          dotnet test tests/NovaClip.Bilibili.Tests/NovaClip.Bilibili.Tests.csproj -c Release

  static-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localization gate
        shell: pwsh
        run: ./scripts/check-localization.ps1
      - name: Architecture gate
        shell: pwsh
        run: ./scripts/check-architecture.ps1
