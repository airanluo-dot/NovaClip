name: Windows native build and acceptance

on:
  push:
    branches: [main, refactor/beta.4-native-rebuild]
    tags: ["v1.0.0-beta.5"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build native solution
        run: |
          dotnet restore NovaClip.slnx
          dotnet build NovaClip.slnx -c Release --no-restore
      - name: Run tests
        run: dotnet test NovaClip.slnx -c Release --no-build --logger "trx;LogFileName=native-rebuild.trx"
      - name: Enforce localization and architecture
        shell: pwsh
        run: |
          ./scripts/check-localization.ps1
          ./scripts/check-architecture.ps1
      - name: Publish portable package
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Configuration Release -OutputRoot artifacts/windows
      - name: Verify WinUI resources
        shell: pwsh
        run: |
          $publish = Join-Path "${{ github.workspace }}" "publish\win-x64"
          if (-not (Test-Path (Join-Path $publish "resources.pri"))) { throw "PUBLISH_MISSING_RESOURCES_PRI" }
          if (-not (Test-Path (Join-Path $publish "NovaClip.exe"))) { throw "PUBLISH_MISSING_APP_EXECUTABLE" }
      - name: Smoke test real page construction
        shell: pwsh
        run: |
          $exe = Join-Path "${{ github.workspace }}" "publish\win-x64\NovaClip.exe"
          $log = Join-Path $env:LOCALAPPDATA "NovaClip\Logs\startup.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $env:NOVACLIP_CI_SMOKE = "1"
          $process = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          $markers = @("App.StartupCompleted", "Shell.Ready", "BrowserPage.Ready", "DownloadsPage.Ready", "HistoryPage.Ready", "SettingsPage.Ready", "WebView2.Ready")
          do {
            Start-Sleep -Seconds 2
            $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
            $ready = $true
            foreach ($marker in $markers) { if ($text -notmatch [regex]::Escape($marker)) { $ready = $false; break } }
          } while ((Get-Date) -lt $deadline -and -not $ready -and -not $process.HasExited)
          Write-Host $text
          foreach ($marker in $markers) { if ($text -notmatch [regex]::Escape($marker)) { Get-Process NovaClip -ErrorAction SilentlyContinue | Stop-Process -Force; throw "SMOKE_MARKER_MISSING:$marker" } }
          if ($text -match "APP_STARTUP_FAILED|XamlParseException|NAVIGATION_FAILED") { Get-Process NovaClip -ErrorAction SilentlyContinue | Stop-Process -Force; throw "SMOKE_STARTUP_ERROR" }
          Get-Process NovaClip -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DPublishDir=${{ github.workspace }}\publish\win-x64" "/DOutputDir=${{ github.workspace }}\artifacts\windows" installer\NovaClip.iss'
      - name: Hash deliverables
        shell: pwsh
        run: Get-ChildItem artifacts/windows -File | Get-FileHash -Algorithm SHA256 | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: NovaClip-1.0.0-beta.5-win-x64-${{ github.sha }}
          path: |
            artifacts/windows/NovaClip-win-x64-portable.zip
            artifacts/windows/NovaClip-1.0.0-beta.5-win-x64-setup.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/tags/v1.0.0-beta.5'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NovaClip-1.0.0-beta.5-win-x64-${{ github.sha }}
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: NovaClip 1.0.0-beta.5 — Startup Reliability Fix
          generate_release_notes: true
          files: release-assets/*
