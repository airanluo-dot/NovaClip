name: Windows build and packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BiliNative.sln
      - name: Build solution
        run: dotnet build BiliNative.sln -c Release --no-restore -p:Platform=x64
      - name: Test solution
        run: dotnet test BiliNative.sln -c Release --no-build --logger "trx;LogFileName=windows-test-results.trx"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Publish app and portable package
        shell: powershell
        run: .\scripts\publish-windows.ps1 -Configuration Release -OutputRoot artifacts\windows
      - name: Verify packaged WinUI resources
        shell: powershell
        run: |
          $publish = Join-Path "${{ github.workspace }}" "publish\win-x64"
          Write-Host "---- WinUI resource files ----"
          Get-ChildItem -Path $publish -Recurse -File | Where-Object { $_.Name -match '\.(pri|xbf)$' } | Select-Object FullName, Length
          $appPri = Join-Path $publish "resources.pri"
          if (-not (Test-Path $appPri)) {
            throw "Published unpackaged WinUI app is missing resources.pri; XAML pages would fail at runtime."
          }
      - name: Smoke test packaged NovaClip startup
        shell: powershell
        run: |
          $exe = Join-Path "${{ github.workspace }}" "publish\win-x64\NovaClip.exe"
          $startupLog = Join-Path $env:LOCALAPPDATA "NovaClip\Logs\startup.log"
          if (Test-Path $startupLog) { Remove-Item $startupLog -Force }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $logText = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { "" }
          Write-Host "---- NovaClip startup.log ----"
          Write-Host $logText
          if ($process.HasExited) {
            throw "NovaClip.exe exited during the startup smoke-test window with exit code $($process.ExitCode)."
          }
          if ($logText -notmatch "Main window activated and startup completed\.") {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "NovaClip stayed alive but did not complete startup."
          }
          if ($logText -notmatch "Navigation completed: BrowserPage\.") {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "NovaClip opened a process/window but BrowserPage did not load successfully."
          }
          if ($logText -match "\[ERROR\] NovaClip startup failed\.") {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "NovaClip wrote a startup failure to startup.log."
          }
          Stop-Process -Id $process.Id -Force
      - name: Build coverage installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DPublishDir=${{ github.workspace }}\publish\win-x64" "/DOutputDir=${{ github.workspace }}\artifacts\windows" installer\NovaClip.iss
      - name: Create combined artifact zip
        shell: powershell
        run: |
          $bundle = "artifacts\windows\NovaClip-win-x64-${{ github.sha }}"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "artifacts\windows\NovaClip-win-x64-portable.zip" $bundle -Force
          Copy-Item "artifacts\windows\NovaClip-1.0.0-beta.3-win-x64-setup.exe" $bundle -Force
          Compress-Archive -Path "$bundle\*" -DestinationPath "artifacts\windows\NovaClip-win-x64-${{ github.sha }}.zip" -CompressionLevel Optimal
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaClip-win-x64-${{ github.sha }}
          path: |
            artifacts/windows/NovaClip-win-x64-${{ github.sha }}.zip
            artifacts/windows/NovaClip-win-x64-portable.zip
            artifacts/windows/NovaClip-1.0.0-beta.3-win-x64-setup.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v1.0.0-beta.3'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package artifact
        uses: actions/download-artifact@v4
        with:
          name: NovaClip-win-x64-${{ github.sha }}
          path: release-assets
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta.3
          name: NovaClip 1.0.0-beta.3
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/NovaClip-win-x64-portable.zip
            release-assets/NovaClip-1.0.0-beta.3-win-x64-setup.exe
            release-assets/NovaClip-win-x64-${{ github.sha }}.zip
