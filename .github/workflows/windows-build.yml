name: Windows native build and acceptance

on:
  push:
    branches: [main, refactor/beta.4-native-rebuild, codex/nova-clip-1.0.0-beta.7-remediation]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      media_acceptance_url:
        description: "Optional permitted public BV/AV URL: exercise real embedded playback, detection and download"
        required: false
        type: string
      baseline_harness_overlay:
        description: "Label an unchanged baseline with acceptance-only instrumentation"
        required: false
        default: false
        type: boolean
  create:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'create' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'publish/'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      runtime_identifier: ${{ steps.version.outputs.runtimeIdentifier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400
      - name: Read build identity
        id: version
        shell: pwsh
        run: |
          [xml]$versionProps = Get-Content version.props -Raw
          $version = [string]$versionProps.Project.PropertyGroup.NovaClipVersion
          $assemblyVersion = [string]$versionProps.Project.PropertyGroup.NovaClipAssemblyVersion
          $runtimeIdentifier = [string]$versionProps.Project.PropertyGroup.NovaClipRuntimeIdentifier
          if ([string]::IsNullOrWhiteSpace($version) -or [string]::IsNullOrWhiteSpace($assemblyVersion) -or [string]::IsNullOrWhiteSpace($runtimeIdentifier)) { throw "VERSION_PROPS_INVALID" }
          if ($env:GITHUB_REF.StartsWith("refs/tags/", [StringComparison]::OrdinalIgnoreCase) -and $env:GITHUB_REF.Substring(10) -ne ("v" + $version)) { throw "TAG_VERSION_MISMATCH" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "assemblyVersion=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "runtimeIdentifier=$runtimeIdentifier" >> $env:GITHUB_OUTPUT
      - name: Restore and build native solution
        run: |
          dotnet restore NovaClip.slnx
          dotnet build NovaClip.slnx -c Release --no-restore
      - name: Generate dependency SBOM
        shell: pwsh
        run: ./scripts/write-dependency-sbom.ps1 -ProjectPath NovaClip.slnx -OutputPath artifacts/dependencies/novaclip.cdx.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NovaClip-dependencies-${{ github.sha }}
          path: artifacts/dependencies/novaclip.cdx.json
          if-no-files-found: error
      - name: Dependency policy
        shell: pwsh
        run: ./scripts/check-dependencies.ps1
      - name: Run tests
        run: dotnet test NovaClip.slnx -c Release --no-build --logger "trx;LogFileName=native-rebuild.trx"
      - name: Enforce localization and architecture
        shell: pwsh
        run: |
          ./scripts/check-localization.ps1
          ./scripts/check-architecture.ps1
      - name: Publish portable package
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Configuration Release -OutputRoot artifacts/windows
      - name: Verify package and WinUI resources
        shell: pwsh
        run: |
          [xml]$versionProps = Get-Content version.props -Raw
          $version = [string]$versionProps.Project.PropertyGroup.NovaClipVersion
          $runtimeIdentifier = [string]$versionProps.Project.PropertyGroup.NovaClipRuntimeIdentifier
          if ([string]::IsNullOrWhiteSpace($runtimeIdentifier)) { throw "VERSION_PROPS_INVALID" }
          $publish = Join-Path "${{ github.workspace }}" ("publish\" + $runtimeIdentifier)
          if (-not (Test-Path (Join-Path $publish "resources.pri"))) { throw "PUBLISH_MISSING_RESOURCES_PRI" }
          if (-not (Test-Path (Join-Path $publish "NovaClip.exe"))) { throw "PUBLISH_MISSING_APP_EXECUTABLE" }
          $artifactRoot = Join-Path "${{ github.workspace }}" "artifacts\windows"
          $portable = Get-ChildItem $artifactRoot -Directory -Filter "*-portable" | Select-Object -First 1
          if ($null -eq $portable) { throw "PACKAGE_PORTABLE_DIRECTORY_MISSING" }
          $manifest = Get-Content (Join-Path $portable.FullName "novaclip-package-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or $manifest.product -ne "NovaClip" -or $manifest.version -ne $version -or $manifest.runtimeIdentifier -ne $runtimeIdentifier -or $manifest.files.Count -lt 3) { throw "PACKAGE_MANIFEST_INVALID" }
          foreach ($file in $manifest.files) {
            $path = Join-Path $portable.FullName ($file.path -replace '/', '\')
            if (-not (Test-Path $path)) { throw "PACKAGE_MANIFEST_FILE_MISSING:" + $file.path }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $file.sha256) { throw "PACKAGE_MANIFEST_HASH_MISMATCH:" + $file.path }
          }
      - name: Smoke test real page construction
        shell: pwsh
        run: |
          [xml]$versionProps = Get-Content version.props -Raw
          $runtimeIdentifier = [string]$versionProps.Project.PropertyGroup.NovaClipRuntimeIdentifier
          $exe = Join-Path "${{ github.workspace }}" ("publish\" + $runtimeIdentifier + "\NovaClip.exe")
          $log = Join-Path $env:LOCALAPPDATA "NovaClip\Logs\startup.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $env:NOVACLIP_CI_SMOKE = "1"
          $process = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          $markers = @("App.StartupCompleted", "Shell.Ready", "BrowserPage.Ready", "DownloadsPage.Ready", "HistoryPage.Ready", "SettingsPage.Ready", "WebView2.Ready", "Browser.CacheOwnershipVerified")
          do {
            Start-Sleep -Seconds 2
            $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
            $ready = $true
            foreach ($marker in $markers) { if ($text -notmatch [regex]::Escape($marker)) { $ready = $false; break } }
          } while ((Get-Date) -lt $deadline -and -not $ready -and -not $process.HasExited)
          Write-Host $text
          foreach ($marker in $markers) { if ($text -notmatch [regex]::Escape($marker)) { Get-Process NovaClip -ErrorAction SilentlyContinue | Stop-Process -Force; throw "SMOKE_MARKER_MISSING:" + $marker } }
          if ($text -match "APP_STARTUP_FAILED|XamlParseException|NAVIGATION_FAILED") { Get-Process NovaClip -ErrorAction SilentlyContinue | Stop-Process -Force; throw "SMOKE_STARTUP_ERROR" }
          Get-Process NovaClip -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Upload native UI captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NovaClip-UI-${{ github.sha }}
          path: publish/**/ui-smoke/*.png
          if-no-files-found: warn
      - name: Ensure FFmpeg for real media acceptance
        if: github.event_name == 'create' || (github.event_name == 'workflow_dispatch' && inputs.media_acceptance_url != '')
        shell: pwsh
        run: |
          if ($null -eq (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or $null -eq (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "ACCEPTANCE_FFMPEG_INSTALL_FAILED" }
          }
          $env:PATH = $env:PATH + ";" + [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($null -eq (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or $null -eq (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) { throw "ACCEPTANCE_FFMPEG_PATH_UNAVAILABLE" }
          "PATH=$env:PATH" >> $env:GITHUB_ENV
      - name: Real embedded-browser media acceptance
        if: github.event_name == 'create' || (github.event_name == 'workflow_dispatch' && inputs.media_acceptance_url != '')
        shell: pwsh
        env:
          NOVACLIP_INPUT_ACCEPTANCE_URL: https://www.bilibili.com/video/BV17x411w7KC/
          NOVACLIP_INPUT_BASELINE_OVERLAY: true
        run: |
          [xml]$versionProps = Get-Content version.props -Raw
          $runtimeIdentifier = [string]$versionProps.Project.PropertyGroup.NovaClipRuntimeIdentifier
          $exe = Join-Path "${{ github.workspace }}" ("publish\" + $runtimeIdentifier + "\NovaClip.exe")
          ./scripts/verify-browser-media.ps1 -ExecutablePath $exe -VideoUrl $env:NOVACLIP_INPUT_ACCEPTANCE_URL -BuildCommit "${{ github.sha }}" -BaselineHarnessOverlay:($env:NOVACLIP_INPUT_BASELINE_OVERLAY -eq "true")
      - name: Upload real media acceptance evidence
        if: always() && github.event_name == 'create' || (github.event_name == 'workflow_dispatch' && inputs.media_acceptance_url != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NovaClip-real-media-${{ github.sha }}
          path: publish/**/media-acceptance/*.json
          if-no-files-found: warn
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $assemblyVersion = "${{ steps.version.outputs.assemblyVersion }}"
          $runtimeIdentifier = "${{ steps.version.outputs.runtimeIdentifier }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DProductVersion=$assemblyVersion" "/DDisplayVersion=$version" "/DOutputBaseFilename=NovaClip-$version-$runtimeIdentifier-setup" "/DPublishDir=${{ github.workspace }}\publish\$runtimeIdentifier" "/DOutputDir=${{ github.workspace }}\artifacts\windows" installer\NovaClip.iss
      - name: Hash deliverables
        shell: pwsh
        run: Get-ChildItem artifacts/windows -File | Get-FileHash -Algorithm SHA256 | Format-Table
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NovaClip-${{ steps.version.outputs.runtimeIdentifier }}-${{ github.sha }}
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'create' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.ref_name == format('publish/v{0}', needs.build.outputs.version))
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit publication request
        if: github.event_name == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$main_sha" || { echo 'Publication branch must match current main'; exit 1; }
          test "$GITHUB_REF_NAME" = "publish/v$RELEASE_VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement'; exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: NovaClip-${{ needs.build.outputs.runtime_identifier }}-${{ github.sha }}
          path: release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          prerelease: true
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NovaClip v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
